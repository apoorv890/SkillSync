services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - skillsync_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    environment:
      MONGODB_URI: mongodb://mongo:27017/SkillSync
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  skillsync_mongo:
