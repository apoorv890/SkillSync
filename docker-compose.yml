# SkillSync: MongoDB + microservices + gateway.
# Copy `.env.example` to `.env` at repo root and set secrets before `docker compose up --build`.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - skillsync_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/SkillSync
      PHONE_AGENT_BASE_URL: http://phone-agent:3010
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  phone-agent:
    build:
      context: ./phone-agent
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3010"
    ports:
      - "3010:3010"
    depends_on:
      - server

volumes:
  skillsync_mongo:
